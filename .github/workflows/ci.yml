name: CI

on:
  push:
    branches: [main]
  # types は既定のまま (opened / synchronize / reopened)。edited は PR タイトルの
  # 検査だけが必要とするもので、それは pr-policy.yml が受け持つ。ここで拾うと
  # タイトルを直すたびに matrix 3 本が丸ごと再走してしまう。
  pull_request:

# リポジトリ既定も read だが、既定が変わっても広がらないよう明示する (CodeQL の
# actions/missing-workflow-permissions)。他のワークフローはすべて明示している。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # **PR では最小サポートの 3.12 だけを回す。** Actions の課金はジョブ単位の
        # 分切り上げで、このジョブは 1 回あたり 20 秒しかかからないのに 3 本 × 1 分が
        # 引かれていた。バージョン差は main への push と週次 (weekly.yml) で見る。
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.12", "3.13", "3.14"]') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存を導入
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: 型チェック (mypy)
        run: mypy src

      # 外部サイトへアクセスするテストは置かない (CI からデータベースを叩かない)。
      - name: テスト (pytest)
        run: pytest -q
