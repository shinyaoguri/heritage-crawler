name: CI

on:
  push:
    branches: [main]
  # types は既定のまま (opened / synchronize / reopened)。edited は PR タイトルの
  # 検査だけが必要とするもので、それは pr-policy.yml が受け持つ。ここで拾うと
  # タイトルを直すたびに matrix 3 本が丸ごと再走してしまう。
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml の classifiers と揃える。PR でも main への push でも同じ
        # 3 本を回す (public リポジトリなので課金されず、並列なので待ちも増えない)。
        # 足し引きしても ruleset は直さなくてよい — 必須チェックは下の check-ok。
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存を導入
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: 型チェック (mypy)
        run: mypy src

      # 外部サイトへアクセスするテストは置かない (CI からデータベースを叩かない)。
      - name: テスト (pytest)
        run: pytest -q

  # ruleset の required status check はこのジョブ (と pr-policy) だけにしてある。
  # matrix の各ジョブ (check (3.12) など) を直接必須にすると、バージョンを
  # 入れ替えるたびに git に残らない ruleset を手で直すことになる。
  #
  # if: always() を外さないこと。外すと check が落ちたときこのジョブは skipped に
  # なり、skipped は必須チェックを満たしたものとして扱われる。
  check-ok:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: matrix の全バージョンが通ったか
        run: test "${{ needs.check.result }}" = success
