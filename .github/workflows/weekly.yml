name: 週次の差分更新

# 台帳を毎週まるごと取り直し、**前回の台帳とバイト単位で突き合わせて**変わったぶんだけ
# 詳細ページを取り直す (ADR 0020)。あわせて全体の 1/52 を巡回する。
#
# **前回の台帳は artifact で持ち回る** (189 ファイル / 6.3 MB、保持 90 日)。
# 前回の出力はデータリポジトリの JSON Lines そのもの (ADR 0018) なので、毎回 10
# リポジトリを clone するところから始めるのは変わらない。
#
# 件数で当たりを付ける案は捨てた — **増加と減少が同じ週に重なると数字が動かず、
# 見逃す**。台帳を取り直すこと自体が正確さの担保になっている。
#
# **データが変わらない週も、確認日だけは各データリポジトリに残す** (ADR 0023)。
# 利用日 (`meta.json`) は「そのデータを取り出した日」なので取り出し直していない種別
# では動かず、動かないままだと**静かなのか止まっているのかが外から見えない**。
# 中身が動かなかったリポジトリには `status.json` だけのコミットが 1 つ立つ。
#
# 必要な secret は 2 つ。code4heritage org の GitHub App で、**対象 10 リポジトリに
# contents:write**、**heritages に actions:write と Variables の書き込み**を与える。
#
# - DATA_PUSH_CLIENT_ID   … App の Client ID
# - DATA_PUSH_PRIVATE_KEY … App の秘密鍵 (PEM のまま)

on:
  schedule:
    # 毎週月曜 03:00 JST (日曜 18:00 UTC)。相手は公共サイトなので深夜帯に寄せる
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: 何を取り直すかまでを見る (詳細は取らず、push もサイトの起動もしない)
        type: boolean
        default: false
      slot:
        description: 巡回の枠 1〜52 (空なら実行週の ISO 週番号)
        type: string
        default: ""

# 同時に走らせない。レートの上限を守れるのは 1 プロセスの中だけで (ADR 0010)、
# 2 本走れば相手から見た実効レートが 2 倍になる。走っている回を殺さないのは、
# push まで終える前に切ると一部のリポジトリだけ更新された状態で残るため。
concurrency:
  group: weekly-update
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read # 前回の run から台帳の artifact を取る

env:
  DATA_DIR: data
  LEDGER_ARTIFACT: ledger
  PREVIOUS_DIR: previous

jobs:
  update:
    runs-on: ubuntu-latest
    # 台帳 204 リクエスト + 巡回 460 件 + 変わったぶん。相手が遅いときの余裕込み。
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 依存を導入
        run: pip install -e .

      # 秘密が無いまま走ると、台帳を取り終えた 30 分後に push で落ちる。
      # 相手先へアクセスする前に気付けるよう、最初に確かめる。
      - name: push 先の資格情報があるか確かめる
        env:
          CLIENT_ID: ${{ secrets.DATA_PUSH_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DATA_PUSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::DATA_PUSH_CLIENT_ID / DATA_PUSH_PRIVATE_KEY が無い。" \
              "code4heritage org の GitHub App を作って登録する"
            exit 1
          fi

      - name: データリポジトリ用のトークンを発行
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DATA_PUSH_CLIENT_ID }}
          private-key: ${{ secrets.DATA_PUSH_PRIVATE_KEY }}
          # リポジトリ名を並べない。**対応表の正本は catalog.TARGET_DATASETS**
          # (ADR 0009 / ADR 0012) で、ここに書くと二重管理になる。App の
          # インストール先を絞ることで範囲を限る。
          owner: code4heritage
          # **App が持つ権限をそのまま渡さない。** 読むだけのこの段では書き込みも
          # 要らないが、同じトークンで後段の clone まで通すので contents に絞る。
          permission-contents: write

      # 出力先の一覧はコードから出す (対応表を YAML に書き写さない)。
      - name: データリポジトリを clone (= 前回の状態)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"
          python - >repos.txt <<'PY'
          from heritage_crawler.catalog import TARGET_DATASETS

          print("\n".join(dataset.repo for dataset in TARGET_DATASETS))
          PY
          while read -r repo; do
            git clone --depth 1 --quiet \
              "https://x-access-token:${GH_TOKEN}@github.com/code4heritage/${repo}.git" \
              "${DATA_DIR}/${repo}"
          done <repos.txt
          echo "clone した: $(wc -l <repos.txt) リポジトリ"

      # **前回の台帳が差分の基準。** artifact は同じ run の中でしか
      # download-artifact で取れないので、前回の成功した run から取り出す。
      # 無ければ「台帳の値が変わったぶん」だけが落ちる (追加・削除・巡回は働く)。
      - name: 前回の台帳を取り出す
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow weekly.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::前回の成功した実行が無い。台帳の値の変化は今回は見つけられない"
            exit 0
          fi
          if gh run download "$run_id" --name "$LEDGER_ARTIFACT" --dir "$PREVIOUS_DIR"; then
            echo "found=true" >>"$GITHUB_OUTPUT"
            echo "前回の台帳を run ${run_id} から取り出した"
          else
            echo "::warning::run ${run_id} に台帳の artifact が無い"
          fi

      # 相手先は時間帯によって 504 を返す (2026-08-12 の実測)。HTTP クライアント側の
      # 再試行 (約 2 分) では抜けられないことがあり、**60 秒の不調で 1 週ぶんの更新が
      # 飛ぶ**のは割に合わない。fetch-ledger は取得済みを飛ばして再開するので、
      # 繰り返しても取りに行くのは未取得のぶんだけ。
      # **取れなかった地域があっても、その回は最後まで進む** (ADR 0022)。取れたぶんは
      # キャッシュに入り、終了コード 1 でここへ戻ってくるので、次の回が試すのは残った
      # 地域だけになる。止めていた頃は、繰り返しても毎回同じ地域で死んで 1 つも
      # 前へ進めなかった (2026-08-16 の実行。Issue #53)。
      # **dry-run でも台帳は取る。** 何を取り直すかは台帳と突き合わせないと決まらず、
      # ここを飛ばすと計画そのものが立たない。相手先へ出るのはこの 204 リクエストで、
      # 重い詳細ページの巡回 (数百件) には進まない。
      - name: 1 段目 — 台帳 (CSV) を取り直す
        run: |
          set -euo pipefail
          {
            echo '## 台帳'
            echo '```'
            ./scripts/retry.sh 3 300 heritage-crawler fetch-ledger
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # **相手先へは出ない。** 手元の CSV どうしをバイト単位で比べるだけ。
      - name: 前回の台帳と突き合わせる
        id: ledger
        if: steps.previous.outputs.found == 'true'  # dry-run でも走らせる (通信しない)
        run: |
          set -euo pipefail
          {
            echo '## 台帳の差分'
            echo '```'
            heritage-crawler compare-ledgers \
              --previous "${PREVIOUS_DIR}/ledger" --json ledger-diff.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "changed=$(jq -r '.changed' ledger-diff.json)" >>"$GITHUB_OUTPUT"

      # **CSV が 1 バイトも変わっていない週は走らせない** (190 リクエストの節約)。
      # 回収ぶん (recovered.csv) は前回のまま残っているので、網羅性の判断もそのまま
      # 通る。都道府県が空の行は回収しないと台帳が全国件数に届かず、消えた指定を
      # 落とせなくなる (401 に 1 件実在。ADR 0017)。
      - name: 一覧と突き合わせて取りこぼしを回収する
        if: inputs.dry-run != true && steps.ledger.outputs.changed != 'false'
        run: |
          set -euo pipefail
          {
            echo '## 網羅性 (検索結果一覧との突き合わせ)'
            echo '```'
            ./scripts/retry.sh 2 300 heritage-crawler audit-listing --recover
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 2 段目 — 差分だけ取り直して書き直す
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          SLOT: ${{ inputs.slot }}
          FOUND: ${{ steps.previous.outputs.found }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # --run-url は status.json に残る (ADR 0023)。確認日が古いまま止まって
          # いるとき、どの実行まで届いていたかをデータリポジトリ側から辿れる。
          args=(--output-dir "$DATA_DIR" --run-url "$RUN_URL")
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${SLOT:-}" ]; then args+=(--slot "$SLOT"); fi
          if [ "${FOUND:-}" = "true" ]; then
            args+=(--previous-ledger "${PREVIOUS_DIR}/ledger")
          fi
          {
            echo '## 差分更新'
            echo '```'
            heritage-crawler update-records "${args[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # **App のトークンは 1 時間で切れる。** 取得に 30〜60 分かかるので、最初に
      # 発行したものは push のころには期限切れになりうる。使う直前に取り直す。
      - name: push 用のトークンを取り直す
        id: push-token
        if: inputs.dry-run != true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DATA_PUSH_CLIENT_ID }}
          private-key: ${{ secrets.DATA_PUSH_PRIVATE_KEY }}
          owner: code4heritage
          permission-contents: write

      # 生成物は決定的なので、データが変わっていなければ JSON Lines は 1 バイトも
      # 動かない (ADR 0014)。**利用日も動かない** (ADR 0020)。動くのは `status.json` の
      # 確認日だけで、その週は「確認 (差分なし)」のコミットが 1 つ立つ (ADR 0023)。
      - name: 確認日と、変わったぶんを commit して push
        id: push
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          changed=0
          checked=0
          # 日付は日本時間で切る — 巡回の枠を決めるのも確認日も日本時間 (ADR 0020 / ADR 0023)
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          {
            echo '## push'
            while read -r repo; do
              cd "${GITHUB_WORKSPACE}/${DATA_DIR}/${repo}"
              git add -A
              if git diff --cached --quiet; then
                # status.json すら動いていない = update-records がこのリポジトリに
                # 触れていない (分類や地域を絞った実行)。確かめた証跡が無いので押さない。
                echo "- ${repo}: 差分なし (このリポジトリは対象外)"
                continue
              fi
              # **中身が動いたかは data / meta.json / removed.jsonl で見る。**
              # status.json は毎週動くので、そのまま数えると全部が「更新」に見える。
              if git diff --cached --quiet -- data meta.json removed.jsonl; then
                message="chore(data): ${today} に確認 (差分なし)"
                note="- ${repo}: 確認のみ"
                checked=$((checked + 1))
              else
                message="chore(data): ${today} の差分を反映"
                note="- ${repo}: $(git diff --cached --shortstat)"
                changed=$((changed + 1))
              fi
              # clone のときに埋め込んだトークンは期限切れになりうる。取り直した
              # ものへ張り替えてから押す。
              git remote set-url origin \
                "https://x-access-token:${GH_TOKEN}@github.com/code4heritage/${repo}.git"
              git -c "user.name=${BOT}" \
                  -c "user.email=${BOT}@users.noreply.github.com" \
                  commit --quiet -m "${message}" \
                                 -m "出典: 国指定文化財等データベース (文化庁)" \
                                 -m "実行: ${RUN_URL}"
              git push --quiet
              echo "${note}"
            done <"${GITHUB_WORKSPACE}/repos.txt"
            echo
            echo "中身が変わったリポジトリ: ${changed} / 確認のみ: ${checked}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "changed=${changed}" >>"$GITHUB_OUTPUT"

      # **次回の基準になるので、push の成否によらず必ず残す。** ここを落とすと
      # 翌週は「前回の台帳が無い」状態になり、台帳の値の変化を拾えなくなる。
      # dry-run でも残す — そのとき取った台帳は本物なので、次の回の基準に使える。
      - name: 今回の台帳を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LEDGER_ARTIFACT }}
          path: cache/ledger
          retention-days: 90

      # README の件数表は書き出したデータから生成している (Issue #37)。ここでしか
      # 検証できない — data は追跡していないので、PR の CI にはデータが無い。
      - name: README の件数表がデータとずれていないか見る
        id: readme
        if: inputs.dry-run != true
        run: |
          set -uo pipefail
          if heritage-crawler render-readme --output-dir "$DATA_DIR" --check >expected.md; then
            echo "drift=false" >>"$GITHUB_OUTPUT"
          else
            echo "drift=true" >>"$GITHUB_OUTPUT"
          fi
          {
            echo '## README の件数表'
            echo '```'
            cat expected.md
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # **確認した日を heritages へも渡す。** データリポジトリの `status.json` と
      # 同じ日付で (ADR 0023)、こちらはサイトの「最終確認」になる。変数に残すのは、
      # サイトのコードを直しただけの回にも表示を保つため。
      # **サイト側へは別のトークンを使う。** データリポジトリへ押すトークンに
      # `actions: write` を乗せない — App が持つ権限をそのまま配らず、行き先と
      # 用途で絞る。ここでも取り直すので期限切れの心配も無い。
      - name: サイト用のトークンを発行
        id: site-token
        if: inputs.dry-run != true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DATA_PUSH_CLIENT_ID }}
          private-key: ${{ secrets.DATA_PUSH_PRIVATE_KEY }}
          owner: code4heritage
          repositories: heritages
          permission-actions: write # deliver.yml を起こす
          permission-variables: write # 確認日を残す

      - name: サイトと配布物を起こす
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          gh variable set LAST_CHECKED_DATE --repo code4heritage/heritages --body "$today"
          gh workflow run deliver.yml --repo code4heritage/heritages \
            --field "checked-date=${today}"
          echo "heritages を起こした (確認日 ${today})" | tee -a "$GITHUB_STEP_SUMMARY"

      # ずれても**ジョブは失敗させず** Issue に残す (データの push は成功している)。
      - name: 件数表のずれを Issue に残す
        if: steps.readme.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="README の件数表がデータとずれている"
          {
            echo "週次の差分更新でデータが変わり、README の件数表が古くなった。"
            echo "データ側は更新済みで、ずれているのはこのリポジトリの README だけ。"
            echo
            echo "手元で作り直して PR を出す (データリポジトリを並べた親を指す):"
            echo
            echo '```'
            echo "heritage-crawler render-readme"
            echo '```'
            echo
            echo "あるべき表:"
            echo
            echo '````markdown'
            cat expected.md
            echo '````'
            echo
            echo "実行: ${RUN_URL}"
          } >body.md

          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi

      # 週次は誰も見ていないところで走る。失敗を Issue に残さないと、
      # データが何週も止まっていることに気付けない (freshness.yml と同じ形)。
      - name: 失敗を Issue に残す
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="週次の差分更新が失敗した"
          {
            echo "週次の差分更新 (\`.github/workflows/weekly.yml\`) が失敗した。"
            echo "データリポジトリは前回のままで、行が消えることはない。"
            echo
            echo "実行: ${RUN_URL}"
            echo
            echo "手元で追うときは (キャッシュがあるローカルで):"
            echo
            echo '```'
            echo "heritage-crawler fetch-ledger"
            echo "heritage-crawler compare-ledgers --previous <前回の ledger/>"
            echo "heritage-crawler audit-listing --recover"
            echo "heritage-crawler update-records --dry-run"
            echo '```'
          } >body.md

          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
