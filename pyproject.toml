[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heritage-crawler"
version = "0.1.0"
description = "国指定文化財等データベースの全データを抽出・記録するクローラー"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shinya Oguri" }]
keywords = ["cultural-heritage", "bunkacho", "crawler", "open-data", "japan"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
heritage-crawler = "heritage_crawler.cli:main"

[project.urls]
Repository = "https://github.com/shinyaoguri/heritage-crawler"

[tool.hatch.build.targets.wheel]
packages = ["src/heritage_crawler"]

[tool.pytest.ini_options]
# src も対象に含めて docstring の実例 (doctest) を実行する。doctest が説明して
# いるのはゼロ詰め ID・未正規化の都道府県・和暦つきの日付といった非自明な入力で、
# 検査されないまま腐ると読んだ人を誤らせる (#20)。
# 相手先へ出る doctest は無いので、CI からデータベースを叩かない方針には触れない。
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 日本語の全角記号を「紛らわしい文字」として警告する規則は、
# 本プロジェクトでは文化財の名称・項目名の大半に当たるため無効化する。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
